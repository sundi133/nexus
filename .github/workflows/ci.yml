name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Typecheck, tests, builds
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus_owner
          POSTGRES_PASSWORD: nexus_owner
          POSTGRES_DB: nexus
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus_owner -d nexus"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (fails on high or critical)
        run: pnpm audit --prod --audit-level high
      - name: Create the runtime role and test database (like deploy/compose/initdb)
        env: { PGPASSWORD: nexus_owner }
        run: |
          psql -h localhost -p 55432 -U nexus_owner -d nexus -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE nexus_app LOGIN PASSWORD 'nexus_app'" \
            -c "GRANT CONNECT ON DATABASE nexus TO nexus_app" \
            -c "CREATE DATABASE nexus_test OWNER nexus_owner" \
            -c "GRANT CONNECT ON DATABASE nexus_test TO nexus_app"
      - name: Typecheck
        run: |
          pnpm --filter @nexus/api typecheck
          pnpm --filter @nexus/web typecheck   # generates Next.js route types first
          pnpm --filter @nexus/mobile exec tsc --noEmit
          pnpm --filter @nexus/cli typecheck
          pnpm --filter @nexus/ldap-directory typecheck
      - name: Build the nexus CLI
        run: pnpm --filter @nexus/cli build && node packages/cli/dist/nexus.mjs --help
      - name: Start MinIO (real S3 for the archive tests)
        run: docker run -d -p 9010:9000 quay.io/minio/minio server /data
      - name: Start OpenLDAP (real LDAPS/StartTLS on a private CA for the directory tests)
        run: |
          apps/api/test/fixtures/ldap/make-certs.sh /tmp/ldap-certs
          docker run -d --name openldap -p 1389:1389 -p 1636:1636 \
            -e LDAP_ROOT=dc=acme,dc=test -e LDAP_ADMIN_USERNAME=admin -e LDAP_ADMIN_PASSWORD=admin-password \
            -e LDAP_CUSTOM_LDIF_DIR=/ldifs -e LDAP_ENABLE_TLS=yes \
            -e LDAP_TLS_CERT_FILE=/certs/server.crt -e LDAP_TLS_KEY_FILE=/certs/server.key -e LDAP_TLS_CA_FILE=/certs/ca.crt \
            -v "$PWD/apps/api/test/fixtures/ldap:/ldifs:ro" -v /tmp/ldap-certs:/certs:ro bitnamilegacy/openldap:2.6
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/1636) 2>/dev/null && break; sleep 1; done
      - name: API tests (incl. security guards)
        env: { NEXUS_TEST_S3_ENDPOINT: "http://127.0.0.1:9010", NEXUS_TEST_LDAP_HOST: localhost, NEXUS_TEST_LDAP_CA: /tmp/ldap-certs/ca.crt }
        run: pnpm --filter @nexus/api test
      - name: Backup and restore test (on the data the tests left behind)
        env: { DATABASE_URL: "postgres://nexus_owner:nexus_owner@localhost:55432/nexus_test" }
        run: |
          deploy/ops/backup.sh /tmp/backups
          deploy/ops/restore-test.sh "$(ls /tmp/backups/*.dump)"
      - name: OpenAPI spec and client are up to date
        run: |
          pnpm api:spec
          git diff --exit-code apps/api/openapi.json packages/api-client/src/schema.d.ts
      - name: Production builds
        run: |
          pnpm --filter @nexus/api build
          pnpm --filter @nexus/web build
      - name: Dependency audit (fails on high or critical)
        run: pnpm audit --prod --audit-level high

  agent:
    name: Go agent
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: agent/go.mod }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./... && GOOS=windows go vet ./... && GOOS=darwin go vet ./...
      - run: go test ./...

  agent-linux-packages:
    name: Linux .deb/.rpm install test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: agent/go.mod }
      - name: Build binaries and packages
        run: |
          mkdir -p rel pkg
          for a in amd64 arm64; do (cd agent && CGO_ENABLED=0 GOOS=linux GOARCH=$a go build -trimpath -ldflags "-X main.version=0.3.0" -o ../rel/nexus-agent-linux-$a ./cmd/nexus-agent); done
          agent/packaging/linux/build-packages.sh 0.3.0 rel pkg
      - name: Install the .deb on this runner (real systemd), then remove it
        run: |
          sudo dpkg -i pkg/nexus-agent_0.3.0_amd64.deb
          sleep 3
          systemctl is-active nexus-agent          # running, waiting to be enrolled
          sudo journalctl -u nexus-agent --no-pager | grep -q "not enrolled yet"
          [ "$(sudo stat -c %a /var/lib/nexus-agent)" = "700" ]
          # Configuration management drops enroll.conf; the service tries to enroll (the server here is unreachable) and keeps running.
          printf 'server=https://127.0.0.1:9\ntoken=nxe_ci\n' | sudo tee /var/lib/nexus-agent/enroll.conf >/dev/null
          sleep 45
          sudo journalctl -u nexus-agent --no-pager | grep -q "enrolling from /var/lib/nexus-agent/enroll.conf failed"
          systemctl is-active nexus-agent
          sudo dpkg -r nexus-agent
          if systemctl is-active --quiet nexus-agent; then echo "still running after removal"; exit 1; fi
          test ! -e /opt/nexus/bin/nexus-agent
      - name: Install the .rpm in Fedora
        run: docker run --rm -v "$PWD/pkg:/pkg:ro" fedora:41 sh -c 'rpm -i /pkg/nexus-agent-0.3.0-1.x86_64.rpm && [ "$(nexus-agent version)" = "0.3.0" ] && rpm -e nexus-agent'
      - uses: actions/upload-artifact@v4
        with: { name: linux-packages, path: pkg/* }

  agent-windows:
    name: Go agent on Windows + MSI install test
    runs-on: windows-latest
    defaults: { run: { shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: agent/go.mod }
      - name: Tests (Windows service, ACLs)
        working-directory: agent
        run: go test ./...
      - name: Build the agent and the MSI (two versions, for the upgrade test)
        run: |
          dotnet tool install --global wix --version 5.0.2
          foreach ($v in "0.1.0", "0.1.1") {
            New-Item -ItemType Directory -Force dist/$v | Out-Null
            Push-Location agent
            go build -trimpath -ldflags "-X main.version=$v" -o ../dist/$v/nexus-agent-windows-amd64.exe ./cmd/nexus-agent
            if ($LASTEXITCODE) { throw "go build failed" }
            Pop-Location
            ./agent/packaging/windows/build-msi.ps1 -Version $v -ReleaseDir dist/$v -OutDir dist/$v -Arch x64
          }
      - name: Install, check, upgrade, uninstall
        run: |
          function Msi([string] $args_) {
            $p = Start-Process msiexec.exe -ArgumentList $args_ -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60 -ErrorAction SilentlyContinue; throw "msiexec $args_ exited $($p.ExitCode)" }
          }
          function Installed { @(Get-ItemProperty HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object DisplayName -eq "Votal Nexus agent") }
          $old = (Resolve-Path dist/0.1.0/nexus-agent-0.1.0-x64.msi).Path
          $new = (Resolve-Path dist/0.1.1/nexus-agent-0.1.1-x64.msi).Path

          # Silent install with enrollment properties, as Intune / GPO would. The server is unreachable,
          # so the service stays up, waiting to enroll from enroll.conf.
          Msi "/i `"$old`" /qn /l*v install.log SERVER=https://127.0.0.1:9 TOKEN=nxe_ci_secret_token"
          Start-Sleep 5
          $svc = Get-Service NexusAgent
          if ($svc.Status -ne "Running" -or $svc.StartType -ne "Automatic") { throw "service: $($svc.Status) $($svc.StartType)" }
          if (-not (Test-Path "C:\Program Files\Nexus\nexus-agent.exe")) { throw "binary missing" }
          $cmd = (Get-CimInstance Win32_Service -Filter "Name='NexusAgent'").PathName
          if ($cmd -notmatch 'run --state-dir "C:\\ProgramData\\Nexus"$') { throw "service command line: $cmd" }
          if (-not ((sc.exe qfailure NexusAgent) -match "RESTART")) { throw "no restart-on-failure" }
          # Locked down: SYSTEM and Administrators only, including the enrollment token file.
          foreach ($path in "C:\ProgramData\Nexus", "C:\ProgramData\Nexus\enroll.conf") {
            $acl = (icacls $path) -join "`n"
            Write-Host $acl
            if ($acl -match "BUILTIN\\Users|Everyone|Authenticated Users") { throw "$path is readable by ordinary users" }
          }
          if (-not ((Get-Content C:\ProgramData\Nexus\enroll.conf) -match "token=nxe_ci_secret_token")) { throw "enroll.conf not written" }
          if (Select-String -Path install.log -Pattern "nxe_ci_secret_token" -Quiet) { throw "the enrollment token leaked into the MSI log" }

          # Upgrade in place: one product, still running.
          Msi "/i `"$new`" /qn /l*v upgrade.log"
          $p = Installed
          if ($p.Count -ne 1 -or $p[0].DisplayVersion -ne "0.1.1") { throw "after upgrade: $($p | Out-String)" }
          if ((Get-Service NexusAgent).Status -ne "Running") { throw "not running after upgrade" }
          if (-not ((& "C:\Program Files\Nexus\nexus-agent.exe" version) -eq "0.1.1")) { throw "old binary after upgrade" }

          # Uninstall: service and program gone, device state kept for a reinstall.
          Msi "/x `"$new`" /qn /l*v uninstall.log"
          if (Get-Service NexusAgent -ErrorAction SilentlyContinue) { throw "service still registered" }
          if (Test-Path "C:\Program Files\Nexus") { throw "program folder left behind" }
          if (-not (Test-Path "C:\ProgramData\Nexus")) { throw "device state should be kept" }
          if ((Installed).Count) { throw "still listed in Programs and Features" }
          Write-Host "MSI install, upgrade and uninstall OK"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: msi, path: "dist/*/*.msi\n*.log", if-no-files-found: ignore }

  images:
    name: Container images + production smoke test
    runs-on: ubuntu-latest
    needs: [platform]
    steps:
      - uses: actions/checkout@v4
      - run: deploy/compose/smoke-test.sh
