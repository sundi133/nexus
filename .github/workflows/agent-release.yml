# Builds, signs, notarizes and verifies an agent release, then drafts a GitHub release with
# every installer. Run it from Actions ("Run workflow") or by pushing a tag agent-vX.Y.Z.
#
# Secrets (see docs/SIGNING.md for how to get each). Anything missing is skipped with a warning,
# except the release key:
#   NEXUS_RELEASE_KEY_B64, NEXUS_RELEASE_PUB          Ed25519 agent release key (required)
#   APPLE_DEVELOPER_ID_APP_P12_B64, APPLE_DEVELOPER_ID_INSTALLER_P12_B64, APPLE_P12_PASSWORD
#   APPLE_NOTARY_KEY_P8_B64, APPLE_NOTARY_KEY_ID, APPLE_NOTARY_ISSUER_ID, APPLE_TEAM_ID
#   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
#   TRUSTED_SIGNING_ENDPOINT, TRUSTED_SIGNING_ACCOUNT, TRUSTED_SIGNING_PROFILE      (Windows)
#   or WINDOWS_CERT_PFX_B64, WINDOWS_CERT_PASSWORD                                  (Windows, legacy)
name: Agent release

on:
  workflow_dispatch:
    inputs:
      version: { description: "Version (e.g. 1.0.0)", required: true }
      notes: { description: "What changed", required: false, default: "" }
  push:
    tags: ["agent-v*"]

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || '' }}
  NOTES: ${{ inputs.notes || '' }}

jobs:
  build:
    name: Build, sign, notarize (macOS host)
    runs-on: macos-14
    env:
      HAS_APPLE: ${{ secrets.APPLE_DEVELOPER_ID_APP_P12_B64 != '' }}
      HAS_WINDOWS: ${{ secrets.TRUSTED_SIGNING_ENDPOINT != '' || secrets.WINDOWS_CERT_PFX_B64 != '' }}
      NEXUS_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
      NEXUS_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
      NEXUS_TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      NEXUS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
      NEXUS_WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      NEXUS_EXPECT_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: agent/go.mod }
      - id: v
        name: Version
        run: |
          v="${VERSION:-${GITHUB_REF_NAME#agent-v}}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version: $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Tools (jsign for Authenticode, osslsigncode to verify)
        run: brew install jsign osslsigncode
      - name: Release key
        env: { KEY: "${{ secrets.NEXUS_RELEASE_KEY_B64 }}", PUB: "${{ secrets.NEXUS_RELEASE_PUB }}" }
        run: |
          [[ -n "$KEY" && -n "$PUB" ]] || { echo "::error::NEXUS_RELEASE_KEY_B64 and NEXUS_RELEASE_PUB are required"; exit 1; }
          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/release.key"
          printf '%s' "$PUB" > "$RUNNER_TEMP/release.pub"
          echo "NEXUS_RELEASE_KEY=$RUNNER_TEMP/release.key" >> "$GITHUB_ENV"
      - name: Apple signing identities (temporary keychain)
        if: env.HAS_APPLE == 'true'
        env:
          APP_P12: ${{ secrets.APPLE_DEVELOPER_ID_APP_P12_B64 }}
          INSTALLER_P12: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_B64 }}
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          NOTARY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8_B64 }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"; pw="$(openssl rand -hex 16)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          for p in APP_P12 INSTALLER_P12; do
            echo "${!p}" | base64 --decode > "$RUNNER_TEMP/$p.p12"
            security import "$RUNNER_TEMP/$p.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/pkgbuild -T /usr/bin/productsign
            rm -f "$RUNNER_TEMP/$p.p12"
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          existing=(); while IFS= read -r k; do existing+=("$k"); done < <(security list-keychains -d user | tr -d '" ')
          security list-keychains -d user -s "$kc" "${existing[@]}"
          app="$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          inst="$(security find-identity -v "$kc" | sed -n 's/.*"\(Developer ID Installer: .*\)"/\1/p' | head -1)"
          [[ -n "$app" && -n "$inst" ]] || { security find-identity -v "$kc"; echo "::error::Developer ID Application and Installer identities not found"; exit 1; }
          echo "NEXUS_CODESIGN_IDENTITY=$app" >> "$GITHUB_ENV"
          echo "NEXUS_INSTALLER_IDENTITY=$inst" >> "$GITHUB_ENV"
          if [[ -n "$NOTARY_P8" ]]; then
            echo "$NOTARY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            { echo "NEXUS_NOTARY_KEY=$RUNNER_TEMP/notary.p8"; echo "NEXUS_NOTARY_KEY_ID=${{ secrets.APPLE_NOTARY_KEY_ID }}"; echo "NEXUS_NOTARY_ISSUER=${{ secrets.APPLE_NOTARY_ISSUER_ID }}"; } >> "$GITHUB_ENV"
          else
            echo "::warning::APPLE_NOTARY_KEY_P8_B64 missing: the .pkg won't be notarized, and MDMs and Gatekeeper will refuse it"
          fi
      - name: Not signing for macOS
        if: env.HAS_APPLE != 'true'
        run: |
          echo "::warning::No Apple Developer ID secrets: macOS binaries and .pkg are unsigned (hand installs only)"
      - name: Not signing for Windows
        if: env.HAS_WINDOWS != 'true'
        run: |
          echo "::warning::No Windows signing secrets: .exe and .msi are unsigned (SmartScreen will warn)"
      - name: Build and sign
        run: agent/scripts/release.sh "${{ steps.v.outputs.version }}" "$NOTES"
      - name: Verify signatures
        run: |
          flags=()
          [[ "$HAS_APPLE" == true ]] && flags+=(--mac)
          [[ "$HAS_WINDOWS" == true ]] && flags+=(--windows)
          [[ ${#flags[@]} -gt 0 ]] && agent/scripts/verify-signatures.sh "agent/dist/releases/${{ steps.v.outputs.version }}" agent/dist/installers "${flags[@]}" || echo "nothing signed to verify"
      - uses: actions/upload-artifact@v4
        with: { name: release, path: "agent/dist/releases/${{ steps.v.outputs.version }}" }
      - uses: actions/upload-artifact@v4
        with: { name: installers, path: agent/dist/installers }
      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

  msi:
    name: Windows installers (WiX)
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: release, path: rel }
      - name: WiX Toolset
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build the .msi (the binaries inside are already signed)
        shell: pwsh
        run: agent/packaging/windows/build-msi.ps1 -Version ${{ needs.build.outputs.version }} -ReleaseDir rel -OutDir msi
      - uses: actions/upload-artifact@v4
        with: { name: msi-unsigned, path: msi }

  publish:
    name: Sign the .msi, verify everything, draft the release
    needs: [build, msi]
    runs-on: macos-14
    env:
      HAS_WINDOWS: ${{ secrets.TRUSTED_SIGNING_ENDPOINT != '' || secrets.WINDOWS_CERT_PFX_B64 != '' }}
      NEXUS_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
      NEXUS_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
      NEXUS_TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      NEXUS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
      NEXUS_WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: release, path: rel }
      - uses: actions/download-artifact@v4
        with: { name: installers, path: installers }
      - uses: actions/download-artifact@v4
        with: { name: msi-unsigned, path: installers }
      - run: brew install jsign osslsigncode
      - name: Sign the .msi
        run: agent/scripts/sign-windows.sh installers/*.msi
      - name: Verify
        if: env.HAS_WINDOWS == 'true'
        run: agent/scripts/verify-signatures.sh rel installers --windows
      - uses: actions/upload-artifact@v4
        with: { name: installers-signed, path: installers }
      - name: Draft the GitHub release
        run: |
          v="${{ needs.build.outputs.version }}"
          tar -czf "nexus-agent-release-$v.tar.gz" -C rel .
          gh release create "agent-v$v" --draft --title "Nexus agent $v" \
            --notes "${NOTES:-Agent $v}. Serve the release archive from NEXUS_AGENT_RELEASES_DIR/$v for self-updates; install with the packages below." \
            installers/* "nexus-agent-release-$v.tar.gz"

  windows-trust:
    name: Windows trusts it (chain, install, uninstall)
    needs: publish
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: installers-signed, path: installers }
      - name: Authenticode chain and silent install
        shell: pwsh
        run: |
          $msi = Get-ChildItem installers\*-x64.msi | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $msi.FullName
          Write-Host "Signature: $($sig.Status) by $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") { Write-Host "::warning::The .msi isn't signed by a trusted publisher ($($sig.Status)). Expected without Windows signing secrets." }
          $p = Start-Process msiexec -ArgumentList "/i `"$($msi.FullName)`" /qn /l*v install.log SERVER=https://127.0.0.1:9 TOKEN=nxe_release_check" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 50; throw "install failed ($($p.ExitCode))" }
          $exe = "C:\Program Files\Nexus\nexus-agent.exe"
          $s2 = Get-AuthenticodeSignature $exe
          Write-Host "Installed binary: $($s2.Status)"
          if ($sig.Status -eq "Valid" -and $s2.Status -ne "Valid") { throw "the installed binary isn't validly signed" }
          $p = Start-Process msiexec -ArgumentList "/x `"$($msi.FullName)`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed ($($p.ExitCode))" }
