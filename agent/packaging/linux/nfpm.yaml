# Linux packages for the Nexus agent (DEV-01): .deb and .rpm, amd64 and arm64.
# Built by build-packages.sh with NEXUS_VERSION, NEXUS_ARCH and NEXUS_BIN set.
name: nexus-agent
arch: ${NEXUS_ARCH}
platform: linux
version: ${NEXUS_VERSION}
version_schema: semver
section: admin
priority: optional
maintainer: Votal AI <support@votal.ai>
vendor: Votal AI
homepage: https://votal.ai
license: Proprietary
description: |
  Votal Nexus device agent. Reports this device's security posture to your
  organization's Nexus, answers device checks at sign-in, and updates itself.
contents:
  - src: ${NEXUS_BIN}
    dst: /opt/nexus/bin/nexus-agent
    file_info: { mode: 0755 }
  - src: ./nexus-agent.service
    dst: /lib/systemd/system/nexus-agent.service
    file_info: { mode: 0644 }
  - dst: /var/lib/nexus-agent
    type: dir
    file_info: { mode: 0700 }
  - src: /opt/nexus/bin/nexus-agent
    dst: /usr/bin/nexus-agent
    type: symlink
scripts:
  postinstall: ./postinstall.sh
  preremove: ./preremove.sh
  postremove: ./postremove.sh
