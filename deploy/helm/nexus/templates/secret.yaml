{{- if not .Values.secret.existingSecret }}
{{- $v := .Values.secret.values }}
{{- range $k := list "databaseUrl" "databaseOwnerUrl" "sealKeys" "smtpUrl" "metricsToken" }}
{{- $_ := required (printf "secret.values.%s is required (or use secret.existingSecret)" $k) (index $v $k) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexus.secretName" . }}
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $val := $v }}
  {{ $k }}: {{ $val | quote }}
  {{- end }}
{{- end }}
