{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
# Pods accept traffic only from the ingress controller, Prometheus, and each other (console → API).
# Egress stays open: the API calls customers' identity providers, SaaS apps, SIEMs and SMTP.
{{- range $c := list "api" "worker" "web" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-%s" (include "nexus.fullname" $) $c }}
  labels:
    {{- include "nexus.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nexus.selector" (list $ $c) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- if ne $c "worker" }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml $np.ingressNamespaceLabels | nindent 14 }}
        {{- end }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml $np.prometheusNamespaceLabels | nindent 14 }}
        {{- if eq $c "api" }}
        - podSelector:
            matchLabels:
              {{- include "nexus.selector" (list $ "web") | nindent 14 }}
        {{- end }}
{{- end }}
{{- end }}
